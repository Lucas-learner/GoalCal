<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoalCal 自然宽度精简主页</title>
<style>
  * { box-sizing:border-box; }
  :root { --bg:#fafaf8; --surface:#fffefd; --soft:#f4f4f1; --ink:#1d1d1f; --muted:#6e6e73; --line:rgba(29,29,31,.08); --accent:#303638; --blue:#6b7f89; --radius:13px; --control:9px; }
  html,body { margin:0; min-height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; letter-spacing:-.01em; }
  a { color:inherit; text-decoration:none; }
  .app { min-height:100vh; display:grid; grid-template-columns:218px minmax(0,1fr); }
  .sidebar { background:rgba(244,244,241,.86); border-right:1px solid var(--line); padding:30px 18px 22px; display:flex; flex-direction:column; backdrop-filter:blur(24px) saturate(120%); }
  .brand { display:flex; align-items:center; gap:10px; padding:0 12px; font-size:20px; font-weight:720; letter-spacing:-.04em; }
  .brand-mark { width:27px; height:27px; border-radius:9px; background:var(--accent); position:relative; }
  .brand-mark:before { content:""; position:absolute; width:9px; height:9px; border:2px solid var(--surface); border-radius:50%; left:7px; top:7px; }
  .nav { margin-top:42px; display:grid; gap:7px; }
  .nav-item { display:flex; align-items:center; gap:12px; height:43px; padding:0 13px; border-radius:var(--control); color:var(--muted); font-size:14px; font-weight:520; }
  .nav-item.active { color:var(--ink); background:#eaeae6; }
  .icon { width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; }
  .icon svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .sidebar-bottom { margin-top:auto; border-top:1px solid var(--line); padding:19px 7px 0; }
  .profile { display:flex; align-items:center; gap:11px; }
  .avatar { width:32px; height:32px; border-radius:50%; background:#eceeef; display:grid; place-items:center; font-size:12px; font-weight:700; }
  .profile-name { font-size:13px; font-weight:600; }
  .profile-meta { color:var(--muted); font-size:11px; margin-top:3px; }
  .main { padding:36px 42px 40px; }
  .content { width:100%; max-width:1040px; margin:0 auto; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .eyebrow { font-size:12px; color:var(--muted); letter-spacing:.05em; margin-bottom:7px; }
  h1 { font-size:30px; line-height:1.2; margin:0; letter-spacing:-.045em; font-weight:700; }
  .assistant { border:1px solid var(--line); background:var(--surface); height:39px; padding:0 14px; display:flex; gap:8px; align-items:center; border-radius:var(--control); font-size:12px; }
  .assistant .icon { color:var(--blue); }
  .focus-card { margin-top:29px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 1px 2px rgba(20,22,24,.02),0 8px 24px rgba(20,22,24,.025); padding:23px 25px; }
  .section-label { color:var(--muted); font-size:11px; font-weight:650; letter-spacing:.06em; }
  .focus-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
  .goal-name { color:var(--muted); font-size:12px; margin-top:14px; }
  .focus-title { font-size:24px; line-height:1.3; font-weight:680; margin:9px 0; letter-spacing:-.035em; }
  .focus-meta { color:var(--muted); font-size:12px; }
  .focus-time { padding:7px 10px; border-radius:8px; background:var(--soft); color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
  .actions { display:flex; gap:9px; margin-top:21px; }
  .btn { height:37px; border-radius:var(--control); padding:0 15px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:12px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); min-width:82px; }
  .attention { display:flex; align-items:center; gap:22px; min-height:45px; padding:0 4px; font-size:11px; }
  .attention-text { color:var(--muted); display:flex; align-items:center; gap:9px; }
  .attention-text:before { content:""; width:6px; height:6px; border:1.5px solid var(--blue); border-radius:50%; }
  .attention-actions { display:flex; gap:16px; }
  .attention-actions a { color:var(--ink); font-weight:590; }
  .attention-actions a:first-child { color:#52636c; }
  .section-head { display:flex; justify-content:space-between; align-items:center; margin:24px 0 10px; }
  .section-title { font-size:13px; font-weight:680; }
  .section-link { color:var(--muted); font-size:11px; }
  .timeline { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .event { display:grid; grid-template-columns:66px minmax(0,1fr) auto; align-items:center; min-height:66px; padding:0 21px; border-bottom:1px solid var(--line); gap:14px; }
  .event:last-child { border:0; }
  .event.current { background:#f6f6f3; }
  .event-time { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .event-name { font-size:12px; font-weight:610; display:flex; align-items:center; gap:9px; }
  .event-name:before { content:""; width:6px; height:6px; border-radius:50%; background:#939b9f; flex:0 0 auto; }
  .event.goal .event-name:before { background:var(--blue); }
  .event-duration { color:var(--muted); font-size:11px; }
  .compare { position:fixed; z-index:5; bottom:18px; left:50%; transform:translateX(-50%); display:flex; padding:5px; gap:4px; background:rgba(28,29,29,.92); border-radius:12px; box-shadow:0 8px 28px rgba(0,0,0,.16); }
  .compare a { color:#c9c9c7; font-size:11px; padding:8px 12px; border-radius:8px; white-space:nowrap; }
  .compare a.active { background:white; color:#222; }
  body.capture .compare { display:none; }
  @media(max-width:900px) { .app { grid-template-columns:180px minmax(0,1fr); } .main { padding:28px 24px; } }
</style>
</head>
<body>

      <a class="nav-item" href="pages.html?page=goals"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="m14.5 9.5 5-5"/></svg></span>目标</a>
